<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempus Vestis — Token Access</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa0ab;
    --accent: #5b8cff;
    --ok: #3fbf7f;
    --err: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .status {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .status.visible { display: block; }
  .status.ok { background: rgba(63, 191, 127, 0.12); color: var(--ok); border: 1px solid rgba(63, 191, 127, 0.3); }
  .status.err { background: rgba(229, 83, 75, 0.12); color: var(--err); border: 1px solid rgba(229, 83, 75, 0.3); }
  .status.loading { background: rgba(90, 140, 255, 0.1); color: var(--accent); border: 1px solid rgba(90, 140, 255, 0.3); }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(91, 140, 255, 0.35);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>Tempus Vestis</h1>
    <p class="sub">Enter your access token to continue.</p>

    <form id="verify-form" autocomplete="off">
      <input type="text" id="token-input" placeholder="Paste your token" required />
      <button type="submit" id="submit-btn">Verify</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <script>
    const form = document.getElementById("verify-form");
    const input = document.getElementById("token-input");
    const submitBtn = document.getElementById("submit-btn");
    const status = document.getElementById("status");

    function setStatus(kind, html) {
      status.className = "status visible " + kind;
      status.innerHTML = html;
    }

    function clearStatus() {
      status.className = "status";
      status.innerHTML = "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = input.value.trim();
      if (!token) return;

      submitBtn.disabled = true;
      input.disabled = true;
      setStatus("loading", '<span class="spinner"></span>Verifying…');

      try {
        const resp = await fetch("/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const data = await resp.json();

        if (resp.ok && data.valid) {
          setStatus("ok", `Token accepted — ${data.uses_remaining} use${data.uses_remaining === 1 ? "" : "s"} remaining`);
        } else {
          setStatus("err", data.error || "Token is invalid, expired, or has no uses remaining");
        }
      } catch (err) {
        setStatus("err", "Could not reach the server. Please try again.");
      } finally {
        submitBtn.disabled = false;
        input.disabled = false;
      }
    });

    input.addEventListener("input", () => {
      if (status.classList.contains("visible")) clearStatus();
    });
  </script>
</body>
</html>
