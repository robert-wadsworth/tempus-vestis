<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempus Vestis — Wardrobe Consultant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa0ab;
    --accent: #5b8cff;
    --ok: #3fbf7f;
    --err: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: -6px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 72px; }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    padding: 11px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .status.visible { display: block; }
  .status.ok { background: rgba(63, 191, 127, 0.12); color: var(--ok); border: 1px solid rgba(63, 191, 127, 0.3); }
  .status.err { background: rgba(229, 83, 75, 0.12); color: var(--err); border: 1px solid rgba(229, 83, 75, 0.3); }
  .status.loading { background: rgba(90, 140, 255, 0.1); color: var(--accent); border: 1px solid rgba(90, 140, 255, 0.3); }
  .recommendation {
    margin-top: 18px;
    padding: 16px;
    border-radius: 8px;
    background: #0f1115;
    border: 1px solid var(--border);
    display: none;
  }
  .recommendation.visible { display: block; }
  .recommendation pre {
    margin: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text);
  }
  .recommendation .meta {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
  }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(91, 140, 255, 0.35);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>Tempus Vestis</h1>
    <p class="sub">Enter your access token and a travel question to get a packing recommendation. Each recommendation uses one token use.</p>

    <form id="recommend-form" autocomplete="off">
      <label for="token-input">Access token</label>
      <input type="text" id="token-input" placeholder="Paste your token" required />

      <label for="query-input">Your question</label>
      <textarea id="query-input" placeholder="What should I pack for Chicago in 7 days?" required></textarea>

      <button type="submit" id="submit-btn">Get recommendation</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="recommendation" class="recommendation">
      <pre id="recommendation-text"></pre>
      <div class="meta" id="recommendation-meta"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("recommend-form");
    const tokenInput = document.getElementById("token-input");
    const queryInput = document.getElementById("query-input");
    const submitBtn = document.getElementById("submit-btn");
    const status = document.getElementById("status");
    const recommendation = document.getElementById("recommendation");
    const recommendationText = document.getElementById("recommendation-text");
    const recommendationMeta = document.getElementById("recommendation-meta");

    function setStatus(kind, html) {
      status.className = "status visible " + kind;
      status.innerHTML = html;
    }

    function clearStatus() {
      status.className = "status";
      status.innerHTML = "";
    }

    function hideRecommendation() {
      recommendation.className = "recommendation";
      recommendationText.textContent = "";
      recommendationMeta.textContent = "";
    }

    function showRecommendation(text, usesRemaining) {
      recommendationText.textContent = text;
      if (typeof usesRemaining === "number") {
        recommendationMeta.textContent =
          `${usesRemaining} use${usesRemaining === 1 ? "" : "s"} remaining on this token`;
      } else {
        recommendationMeta.textContent = "";
      }
      recommendation.className = "recommendation visible";
    }

    function setInputsDisabled(disabled) {
      submitBtn.disabled = disabled;
      tokenInput.disabled = disabled;
      queryInput.disabled = disabled;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      const query = queryInput.value.trim();
      if (!token || !query) return;

      hideRecommendation();
      setInputsDisabled(true);
      // The LLM round trip typically takes several seconds (roughly 5–15s),
      // noticeably longer than the Phase 1 verify-only call.
      setStatus("loading", '<span class="spinner"></span>Thinking about your trip… this can take up to 15 seconds.');

      try {
        const resp = await fetch("/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, query }),
        });
        const data = await resp.json();

        if (resp.ok && typeof data.recommendation === "string") {
          clearStatus();
          showRecommendation(data.recommendation, data.uses_remaining);
        } else if (resp.status === 502) {
          // Reached the pipeline but it failed (e.g. weather/LLM service issue).
          // Note: the token use was already consumed on the auth service.
          setStatus("err", (data.error || "The recommendation service had a problem.") +
            " Your token use for this attempt was already spent.");
        } else {
          // Auth failure — invalid, expired, or exhausted token. No use spent.
          setStatus("err", data.error || "Token is invalid, expired, or has no uses remaining.");
        }
      } catch (err) {
        setStatus("err", "Could not reach the server. Please try again.");
      } finally {
        setInputsDisabled(false);
      }
    });

    function clearOnEdit() {
      if (status.classList.contains("visible")) clearStatus();
    }
    tokenInput.addEventListener("input", clearOnEdit);
    queryInput.addEventListener("input", clearOnEdit);
  </script>
</body>
</html>
